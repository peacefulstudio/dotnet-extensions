name: Publish NuGet Packages (reusable)

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag the packages were built from (e.g. v0.3.3).'
        required: true
        type: string
      version:
        description: 'Package version, the tag without its leading v.'
        required: true
        type: string
    secrets:
      NUGET_USER:
        description: 'nuget.org username for OIDC trusted publishing (NuGet/login).'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.tag }}
      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: '10.0.x'
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: output/nuget
      - name: Confirm no shipped package has this version on nuget.org
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: .github/scripts/assert-versions-unpublished.sh "$PACKAGE_VERSION"
      - name: NuGet login (OIDC -> short-lived key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push packages to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: .github/scripts/push-packages.sh output/nuget "$PACKAGE_VERSION"
